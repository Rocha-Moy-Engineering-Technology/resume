<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#000000"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>
      Pedro Henrique Rocha Moy - Artificial Intelligence, Machine Learning, Data
      Science, Data &amp; Software Engineering
    </title>
    <script>
      /*
       * Pre-paint theme bootstrap. The placeholders are substituted at build
       * time from src/types/theme.ts, so the key, attribute and media query can
       * never drift from the application code.
       */
      (function () {
        try {
          var stored = window.localStorage.getItem('__THEME_STORAGE_KEY__');
          var explicit = stored === 'light' || stored === 'dark';
          var dark = window.matchMedia('__DARK_SCHEME_QUERY__').matches;
          document.documentElement.setAttribute(
            '__THEME_ATTRIBUTE__',
            explicit ? stored : dark ? 'dark' : 'light'
          );
        } catch (error) {
          document.documentElement.setAttribute('__THEME_ATTRIBUTE__', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
